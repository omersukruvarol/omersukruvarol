name: Refresh profile stats

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Read public GitHub data and render the profile
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/refresh_stats.py || { sleep 20; python3 tools/refresh_stats.py; }
      - name: Publish updated cards
        run: |
          git add -- tools/stats.json README.md assets/portrait/stats.svg assets/portrait/stats-mobile.svg
          if git diff --cached --quiet; then
            echo "The published stats are current."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public GitHub stats'
          git push origin HEAD
